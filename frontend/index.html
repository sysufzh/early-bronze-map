<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中国考古地理信息系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #e2e8f0;
}
.hero { text-align: center; margin-bottom: 48px; }
.hero h1 { font-size: 36px; font-weight: 700; letter-spacing: 4px; margin-bottom: 8px; }
.hero p { font-size: 16px; color: #94a3b8; letter-spacing: 2px; }
.cards { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; padding: 0 24px; }
.card {
  display: block; width: 360px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
  padding: 40px 32px; text-decoration: none; color: #e2e8f0;
  transition: all 0.3s ease; backdrop-filter: blur(10px);
}
.card:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-4px); }
.card-icon { font-size: 48px; margin-bottom: 20px; }
.card h2 { font-size: 22px; margin-bottom: 12px; font-weight: 600; }
.card p { font-size: 14px; color: #94a3b8; line-height: 1.7; }
.card-tag { display: inline-block; margin-top: 16px; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
.tag-bronze { background: rgba(245,158,11,0.2); color: #fbbf24; }
.tag-site { background: rgba(34,197,94,0.2); color: #4ade80; }
.footer { margin-top: 64px; font-size: 12px; color: #64748b; text-align: center; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?323b7c2ae8c3afb731039b7fc7203db5";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
</head>
<body>
<div class="hero">
  <h1>中国考古地理信息系统</h1>
  <p>Archaeological Geographic Information System of China</p>
</div>
<div class="cards">
  <a href="/bronze/" class="card">
    <div class="card-icon">&#129684;</div>
    <h2>中国早期铜器数据库</h2>
    <p>收录中国境内早期铜器（青铜时代及以前）的空间分布、文化属性、形制特征等数据，支持按区域、时代、材质、器型等多维度检索与地图浏览。</p>
    <span class="card-tag tag-bronze">铜器 · 青铜时代</span>
  </a>
  <a href="/prehistoric/" class="card">
    <div class="card-icon">&#127963;</div>
    <h2>中国史前遗址地理信息系统</h2>
    <p>汇集中国各地区史前考古遗址的空间分布、文化分期、发掘历史等信息，通过时空筛选功能探索遗址的地理格局与演变。</p>
    <span class="card-tag tag-site">遗址 · 史前考古</span>
  </a>
</div>
<div class="footer">&#169; 2026 中国考古地理信息系统 · ArchaeoGIS</div>
</body>
</html>
